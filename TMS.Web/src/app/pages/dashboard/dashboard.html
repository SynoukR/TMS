<div class="dashboard">

  <div class="page-header">
    <h1 class="page-title">Dashboard</h1>
    <p class="page-subtitle">Vue d'ensemble du parc de terminaux</p>
  </div>

  <div class="cards" role="list">

    <div class="card" role="listitem" aria-label="Nombre de terminaux">
      <div class="card-icon blue" aria-hidden="true">🖥️</div>
      <div class="card-info">
        <span class="card-value">—</span>
        <span class="card-label">Terminaux</span>
      </div>
    </div>

    <div class="card" role="listitem" aria-label="Commandes en cours">
      <div class="card-icon orange" aria-hidden="true">⚡</div>
      <div class="card-info">
        <span class="card-value">—</span>
        <span class="card-label">Commandes en cours</span>
      </div>
    </div>

    <div class="card" role="listitem" aria-label="Terminaux actifs">
      <div class="card-icon green" aria-hidden="true">✅</div>
      <div class="card-info">
        <span class="card-value">—</span>
        <span class="card-label">Terminaux actifs</span>
      </div>
    </div>

    <div class="card" role="listitem" aria-label="Alertes actives">
      <div class="card-icon red" aria-hidden="true">🔔</div>
      <div class="card-info">
        <span class="card-value">—</span>
        <span class="card-label">Alertes</span>
      </div>
    </div>

  </div>

</div>
